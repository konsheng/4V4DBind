# 支持MiniMessage, 所有格式标签必须完整闭合
# 动态资料通过纯文本占位符插入, 不会解析资料中的标签
prefix: '<dark_gray>[</dark_gray><aqua>4V4DBind</aqua><dark_gray>]</dark_gray> '
help:
  header: '<aqua>4V4DBind 帮助</aqua>'
  line: '<gray><usage></gray>'
  query: '<gray>/bind list [类型] [页码] | /bind view \<编号> | /bind remove \<编号></gray>'
  admin: '<gray>/bind admin list|view|add|remove \<玩家或UUID> ... | /bind reload</gray>'
list:
  header: '<aqua><player> 的绑定资料</aqua><gray> | 共 <total> 条</gray>'
  line: '<gray>#<id></gray> <yellow><type></yellow> <white><fields></white> <dark_gray><time></dark_gray>'
  page: '<gray>第 <page>/<pages> 页</gray>'
  empty: '<gray>暂无符合条件的绑定资料</gray>'
details:
  header: '<aqua>绑定记录 #<id></aqua>'
  line: '<gray><field>: </gray><white><value></white>'
  metadata: '<gray>类型: <type> | 玩家: <player> | 时间: <time> | 操作者: <actor></gray>'
saved: '<green>已绑定 <type>, 记录编号为 #<id></green>'
removed: '<green>已删除绑定记录 #<id></green>'
reload:
  started: '<gray>正在读取并验证配置</gray>'
  success: '<green>配置已重载</green>'
  failed: '<red>配置重载失败, 已保留当前配置, 请检查服务端日志</red>'
  restart-required: '<red>任务队列或数据库超时设置已改变, 请重启服务端后应用</red>'
errors:
  permission: '<red>你没有执行此操作的权限</red>'
  player-only: '<red>此命令只能由玩家执行</red>'
  usage: '<red>命令格式错误</red> <gray><usage></gray>'
  invalid-input: '<red>输入内容无效, 请检查字段格式和长度</red>'
  invalid-field: '<red><field> 的内容无效</red>'
  invalid-id: '<red>记录编号必须是有效的正整数</red>'
  invalid-page: '<red>页码必须是有效的正整数</red>'
  unknown-type: '<red>绑定类型不存在或当前不可用</red>'
  unknown-player: '<red>未找到该玩家, 请使用已识别的玩家名或UUID</red>'
  ambiguous-player: '<red>玩家名存在歧义, 请使用UUID</red>'
  not-found: '<red>记录不存在或无权访问</red>'
  duplicate: '<red>你已经绑定过相同的资料</red>'
  limit: '<red><type> 已达到绑定数量上限 <limit></red>'
  rate-limit: '<red>操作过于频繁, 请稍后重试</red>'
  in-flight: '<red>你的请求仍在处理中, 请稍后重试</red>'
  busy: '<red>当前请求较多, 请稍后重试</red>'
  unavailable: '<red>资料服务暂时不可用, 请联系管理员</red>'
  storage: '<red>未能确认操作结果, 请先查询记录后再重试</red>'
  incompatible-schema: '<red>资料类型结构与已保存数据不兼容, 请联系管理员</red>'
  internal: '<red>操作未能完成, 请联系管理员</red>'
